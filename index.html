<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor-e-Madni - نور مدنی</title>
    <style>
        :root {
            --primary-green: #0b4619;
            --emerald-green: #138808;
            --gold: #d4af37;
            --light-gold: #f4e8c1;
            --dark-bg: #05260c;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(5, 38, 12, 0.9), rgba(11, 70, 25, 0.9)), url('1000020942.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 2px solid var(--gold);
        }
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            object-fit: cover;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        h1 {
            color: var(--gold);
            margin: 5px 0;
            font-size: 24px;
        }
        .subtitle {
            font-size: 14px;
            color: var(--light-gold);
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 15px;
        }
        .card {
            background: rgba(11, 70, 25, 0.85);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card h3 {
            color: var(--gold);
            margin-top: 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 8px;
        }
        .btn {
            display: inline-block;
            background: var(--gold);
            color: #000;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            font-size: 14px;
        }
        .footer-nav {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border-top: 1px solid var(--gold);
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="1000020940.jpg" alt="Noor-e-Madni Logo" class="logo">
        <h1>Noor-e-Madni</h1>
        <div class="subtitle">শানে পীর ও মুরশিদ Hazrat Madni Miyan</div>
    </div>

    <div class="container">
        <div class="card">
            <h3>📖 આજનો ઇસ્લામિક સુविचार / કલામ</h3>
            <p>"મુહબ્બતે રસूल અને પૌરાણિક અકીદો જ આપણી સાચી ઓળખ છે."</p>
            <button class="btn" onclick="shareOnWhatsApp('મુહબ્બતે રસूल અને પૌરાણિક અકીદો જ આપણી સાચી ઓળખ છે. - Noor-e-Madni App')">💬 WhatsApp પર શેર કરો</button>
        </div>

        <div class="card">
            <h3>🕋 મક્કા અને મદીના લાઈવ ઝિયારત</h3>
            <p>એપની અંદરથી જ મક્કા મુઅ્ઝમા અને મદીના મુનવ્વરાના દર્શન કરો.</p>
            <a href="https://www.youtube.com/results?search_query=makkah+madinah+live" target="_blank" class="btn">▶ લાઈવ ઝિયારત જુઓ</a>
        </div>
    </div>

    <div class="footer-nav">
        <a href="https://whatsapp.com/channel/YOUR_CHANNEL_LINK" target="_blank" class="btn" style="background:#25D366; color:#fff;">📢 WhatsApp ચેનલ જૉઇન કરો</a>
    </div>

    <script>
        function shareOnWhatsApp(message) {
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://api.whatsapp.com/send?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
